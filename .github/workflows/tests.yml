name: PowerShell tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pester tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.4.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run offline tests
        shell: pwsh
        run: Invoke-Pester -Path ./Tests -CI -Output Detailed
